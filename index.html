<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Translator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="translator-container">
        <h2>Language Translator</h2>
        
        <div class="row">
            <!-- Source Language Selection & Input -->
            <div class="col">
                <select id="source-lang">
                    <option value="en">English</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                </select>
                <textarea id="source-text" placeholder="Type text here..."></textarea>
            </div>

            <!-- Target Language Selection & Output -->
            <div class="col">
                <select id="target-lang">
                    <option value="es" selected>Spanish</option>
                    <option value="en">English</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                </select>
                <textarea id="target-text" placeholder="Translation will appear here..." readonly></textarea>
            </div>
        </div>

        <button id="translate-btn">Translate Text</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
